<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Org Chart App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    button { padding: 8px 12px; }
    input { padding: 8px 10px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Org Chart App</h1>
  <div id="app" class="box">Loading…</div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const app = document.getElementById("app");
  app.innerText = "✅ Inline JS is running...";

  // If the Supabase CDN script failed to load, we show it clearly
  if (!window.supabase) {
    app.innerText =
      "❌ Supabase JS library did not load. Likely blocked by browser/extension or CDN failed.";
    throw new Error("Supabase JS library did not load (window.supabase is undefined).");
  }

  const SUPABASE_URL = "https://gsyjnjcjfrejcevauql.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_VrYJn2ogF288D8mHJsTA-w_dNpKUuPl";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async () => {
    app.innerText = "✅ Supabase library loaded. Testing auth session...";
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) {
      app.innerText = "❌ Supabase error: " + error.message;
      return;
    }
    app.innerText = "✅ Connected. Logged in: " + (data.session ? "YES" : "NO");
  })();
</script>
</body>
</html>
