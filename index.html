<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Org Chart App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    button { padding: 8px 12px; cursor: pointer; }
    input { padding: 8px 10px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Org Chart App</h1>
  <div id="app" class="box">Loading…</div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://gsypjnjcfjrejcevaqul.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_VrYJn2ogF288D8mHJsTA-w_dNpKUuPl";

    const app = document.getElementById("app");

    // Make failures visible instead of silently staying on "Loading…"
    try {
      if (!window.supabase) {
        app.innerText = "❌ Supabase JS failed to load (window.supabase is missing).";
        throw new Error("Supabase JS not loaded");
      }

      // IMPORTANT: use a unique name to avoid 'already declared' conflicts
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function renderLoggedIn(user) {
  app.innerHTML = `
    <h2>✅ Logged in</h2>
    <p>${user.email}</p>
    <button id="logoutBtn">Sign out</button>

    <hr style="margin: 16px 0;" />

    <h3>My org charts</h3>

    <div style="display:flex; gap:10px; max-width:520px; margin-bottom:12px;">
      <input id="orgName" placeholder="New org chart name (e.g. Robert Bosch Hatvan Plant)" />
      <button id="createOrgBtn">Create</button>
    </div>

    <div id="orgMsg" style="color:crimson; margin-bottom:10px;"></div>
    <div id="orgList">Loading…</div>
  `;

  document.getElementById("logoutBtn").onclick = async () => {
    await supabaseClient.auth.signOut();
  };

  async function loadOrgs() {
    const orgList = document.getElementById("orgList");
    const orgMsg = document.getElementById("orgMsg");
    orgMsg.textContent = "";
    orgList.textContent = "Loading…";

    const { data, error } = await supabaseClient
      .from("organisations")
      .select("id, name, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      orgList.textContent = "";
      orgMsg.textContent = error.message;
      return;
    }

    if (!data || data.length === 0) {
      orgList.innerHTML = `<div style="opacity:0.7;">No org charts yet.</div>`;
      return;
    }

    orgList.innerHTML = `
      <ul style="padding-left:18px; margin:0; display:grid; gap:6px;">
        ${data.map(o => `
          <li>
            <b>${escapeHtml(o.name)}</b>
            <div style="opacity:0.6; font-size:12px;">${o.id}</div>
          </li>
        `).join("")}
      </ul>
    `;
  }

  document.getElementById("createOrgBtn").onclick = async () => {
    const orgMsg = document.getElementById("orgMsg");
    orgMsg.textContent = "";

    const name = document.getElementById("orgName").value.trim();
    if (!name) return;

    const { error } = await supabaseClient
      .from("organisations")
      .insert({ name, created_by: user.id });

    if (error) {
      orgMsg.textContent = error.message;
      return;
    }

    document.getElementById("orgName").value = "";
    await loadOrgs();
  };

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c]));
  }

  loadOrgs();
}
  </script>
</body>
</html>
